[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license-file = "LICENSE.md"

[workspace.dependencies]
btt-fares = { path = "crates/btt-fares" }
btt-geo = { path = "crates/btt-geo" }
btt-model = { path = "crates/btt-model" }
btt-planner = { path = "crates/btt-planner" }
btt-quotes = { path = "crates/btt-quotes" }
btt-router = { path = "crates/btt-router" }
btt-storage = { path = "crates/btt-storage" }
btt-builder = { path = "crates/btt-builder" }
btt-ticketing = { path = "crates/btt-ticketing" }
btt-timetable = { path = "crates/btt-timetable" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
fixedbitset = "0.5.7"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
duckdb = { version = "1.10505.0", features = ["bundled", "json", "parquet"] }
governor = "0.10.4"
memmap2 = "0.9.11"
nalgebra = "0.35.0"
postcard = { version = "1.1.3", features = ["use-std"] }
proptest = "1.11.0"
rkyv = "0.8.18"
rstar = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
rusqlite_migration = "2.6.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
smol_str = { version = "0.3.6", features = ["serde"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "uuid", "smallvec", "smol_str"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-build = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quick-xml = "0.42.0"
regex = "1.13.1"
tzf-rs = { version = "2.1.2", default-features = false, features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }
semver = "1.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependencies build optimized and without debug info. The router calls into them in its inner
# loops, and DuckDB's C++ sources alone would otherwise produce several gigabytes of debug
# objects.
[profile.dev.package."*"]
debug = false
opt-level = 2

# The router and the bundle reader run searches that take seconds unoptimized, which makes the
# development build of the app wait on every edit.
[profile.dev.package.btt-router]
opt-level = 3

[profile.dev.package.btt-timetable]
opt-level = 3


# The search is generic over its boarding filter, so its code is compiled in the planner, which
# calls it.
[profile.dev.package.btt-planner]
opt-level = 3

# The app instantiates the router with its own pricer, so the generic planner and search code is
# compiled in the app crate. Unoptimized, a long leg takes 12 seconds there instead of 1.
[profile.dev.package.btt-app]
opt-level = 3

# The ranking prices every journey with the fares, and the extras price many more.
[profile.dev.package.btt-ticketing]
opt-level = 2

[profile.dev.package.btt-fares]
opt-level = 2
