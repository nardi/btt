[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license-file = "LICENSE.md"

[workspace.dependencies]
btt-model = { path = "crates/btt-model" }
btt-geo = { path = "crates/btt-geo" }

chrono-tz = "0.10.4"
governor = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tzf-rs = { version = "2.1.2", default-features = false, features = ["bundled"] }

chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
smol_str = { version = "0.3.6", features = ["serde"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "uuid", "smallvec", "smol_str"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
