# Feeds the timetable builder reads, by their name on the Transitous mirror at
# https://api.transitous.org/gtfs/. The part before the first underscore names the country file
# in the Transitous feed configuration, which holds the license of each feed.

validity_window_days = 90

# Categories of trains with couchettes or sleepers, compared without regard to case. A train
# also counts when any feed gives it the GTFS route type 105, and when any feed's copy of a
# merged train does.
night_train_categories = [
    "NJ",
    "Nightjet",
    "EN",
    "EuroNight",
    "ES",
    "European Sleeper",
    "ICN",
    "InterCityNotte",
    "INTERCITES de nuit",
]

[[feed]]
mirror_name = "nl_OpenOV"
# Platforms carry the station area as parent_station, so the default key rule fits.
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "de_DELFI"
# DHID platform IDs such as de:05315:11201:7:71 often have no parent_station.
station_key_pattern = '^(de:\d+:\d+)'
station_key_namespace = "dhid"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Route short names are line numbers, so the category comes from the route type.
category_field = "route_type"

[[feed]]
# Transitous removes the Berlin and Brandenburg operators from DELFI and loads them from this
# feed instead, so without it no regional train or S-Bahn crosses Berlin.
mirror_name = "de_VBB"
station_key_pattern = '^(de:\d+:\d+)'
station_key_namespace = "dhid"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Route short names are lines such as "RE1" and "S5".
category_field = "route_short_name"

[[feed]]
mirror_name = "at_Railway-Current-Reference-Data-2026"
# Platforms carry their station as parent_station, such as Pat:44:46500.
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "eu_european-sleeper"
station_code = "uic_in_stop_id"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "be_sncb"
# Stop IDs start with the UIC code, as in 8891140_1 for a platform of Aalter.
station_code = "uic_in_stop_id"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
# Route short names are products such as "IC" or lines such as "S41".
category_field = "route_short_name"

[[feed]]
mirror_name = "fr_horaires-sncf"
format = "netex"
source_url = "https://mirror.traines.eu/french-netex/sncf-netex.fixed.zip"
# Scheduled stop point IDs end with the UIC code and its check digit.
station_code = "uic8_in_stop_id"
# Journeys carry brand codes instead of product names.
netex_brand_names = { TER = "TER", OUI = "TGV INOUI", TGVOUIGO = "OUIGO", OUIGO_TC = "OUIGO Train Classique", IC = "INTERCITES", ICN = "INTERCITES de nuit", LYR = "Lyria", DBS = "DB SNCF", SNF = "SNCF" }
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "fr_eurostar-gtfs-plan-de-transport-et-temps-reel"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
# Route short names are station code pairs, and every agency is named Eurostar.
category_field = "agency_name"

# Swiss timetables run from December to December, so the window needs two feeds around the
# change of timetable.
[[feed]]
mirror_name = "ch_opentransportdataswiss26"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
# Route descriptions hold the product, such as "IC", "IR" or "S".
category_field = "route_desc"

[[feed]]
mirror_name = "ch_opentransportdataswiss27"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "route_desc"

[[feed]]
# Trenitalia publishes NeTEx in the Italian profile only. Transitous converts nothing, so this
# is the NeTEx file its preprocessor collects from the Italian access point.
mirror_name = "it_trenitalia"
format = "netex"
source_url = "https://public-transport.github.io/transitous-trenitalia-preprocessor/trenitalia-netex.zip"
station_code = "uic_in_private_code"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Lines are products, such as FR for Frecciarossa or REG for regional trains.
category_field = "route_short_name"

[[feed]]
# Italo's own NeTEx needs many fixes: it marks coaches as rail, hides changes of train in long
# dwells and keeps train numbers in journey IDs. A weekly community conversion to GTFS does
# that work, so the builder reads its GTFS instead.
mirror_name = "it_italo"
source_url = "https://raw.githubusercontent.com/deryclem/italo-gtfs/main/gtfs-italo.zip"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Stop IDs such as czptt:stop:CZ:57076 hold the five digits that follow the country code 54 in
# the UIC code. Stops in other countries have other prefixes and match by name and distance.
mirror_name = "cz_CZPTT"
station_code = "uic_in_stop_id"
station_code_pattern = '^czptt:stop:CZ:(\d{5})$'
station_code_prefix = "54"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# MÁV fills the long name of routes with the train, as in "IC 935 SAVARIA", and the short name
# of suburban lines, as in "S70".
mirror_name = "hu_mav"
[feed.train_label]
field = "route_long_name"
fallback_field = "route_short_name"
pattern = '^(?:(?<category>\p{L}+)\s*)?(?<number>\d+)\b'
category_field = "agency_name"
category_pattern = '^(?<category>\p{L}+)'

[[feed]]
mirror_name = "si_nap"
[feed.train_label]
field = "route_short_name"
pattern = '^(?:(?<category>[A-Za-z]+)\s*)?(?<number>\d+)$'
category_field = "agency_name"
category_pattern = '^(?<category>S\p{L})'

[[feed]]
mirror_name = "hr_hz"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"
category_pattern = '^(?<category>H\p{L})'

[[feed]]
# Stop IDs hold the seven-digit UIC code of the station. A station's own stop ID has five zeros
# before it, and a platform has three zeros before it and two digits of platform number after.
mirror_name = "dk_rejseplanen"
station_key_pattern = '^0{3,5}(86\d{5})(?:\d{2})?$'
station_code = "uic_in_stop_id"
station_code_pattern = '^0{3,5}(86\d{5})(?:\d{2})?$'
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Route short names are lines, so the agency names the category, such as "DSB".
category_field = "agency_name"

[[feed]]
# Stops are national stop IDs without UIC codes. Trains carry their number in the trip short
# name, or in the route short name when the trip has none.
mirror_name = "se_Trafiklab"
[feed.train_label]
field = "trip_short_name"
fallback_field = "route_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
# Norwegian trains have no numbers, so the line is the label.
mirror_name = "no_Entur"
station_code = "entur_stop_place"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>.+)$'
category_field = "agency_name"
number_is_line = true

[[feed]]
# Île-de-France Mobilités runs the RER and Transilien trains, which SNCF's own file leaves out.
# Trip short names are train numbers, sometimes two joined by a dash for a train that changes
# number. The same file has the TER trains of the region, which merge with SNCF's copies.
mirror_name = "fr_reseau-urbain-et-interurbain-dile-de-france-mobilites"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)'
category_field = "agency_name"

[[feed]]
# Trenitalia's own trains between Paris, Lyon, Marseille and Milan. The route ID is the train
# number.
mirror_name = "fr_horaires-des-trains-trenitalia-france"
[feed.train_label]
field = "route_id"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
mirror_name = "pl_PKP-Intercity"
[feed.train_label]
# Trip short names put the number first, as in "306 Porta Moravica".
field = "trip_short_name"
pattern = '^(?<number>\d+)'
category_field = "route_short_name"

[[feed]]
mirror_name = "pl_Polish-Trains"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)'
# Route short names are lines, so the operator names the category.
category_field = "agency_name"

[[feed]]
mirror_name = "pl_PKP-Intercity-Germany"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Stop IDs are UIC codes.
mirror_name = "sk_zsr"
station_code = "uic_in_stop_id"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Stop IDs are the five digits of the UIC code after the country code 53.
mirror_name = "ro_railway"
station_code = "uic_in_stop_id"
station_code_pattern = '^(\d{5})$'
station_code_prefix = "53"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Station names are in Cyrillic, which Trainline's Latin names never match.
mirror_name = "bg_bdz"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Stop IDs are UIC codes. The feed also holds Montenegrin and Hungarian trains.
mirror_name = "rs_Srbijavoz"
station_code = "uic_in_stop_id"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "me_zpcg"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
mirror_name = "mk_zr-north-macedonia"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Stop IDs are UIC codes.
mirror_name = "gr_Hellenic-Train"
station_code = "uic_in_stop_id"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
mirror_name = "tr_tcdd"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
# Stop IDs are the five digits of the UIC code after the country code 71.
mirror_name = "es_RENFE-Larga-Distancia-y-AVE"
station_code = "uic_in_stop_id"
station_code_pattern = '^(\d{5})$'
station_code_prefix = "71"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# Stop IDs are two zeros and the seven-digit UIC code.
mirror_name = "es_Ouigo"
station_code = "uic_in_stop_id"
station_code_pattern = '^00(\d{7})$'
[feed.train_label]
field = "trip_short_name"
pattern = '^\D*(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
# Commuter trains have lines and no train numbers.
mirror_name = "es_Cercanías-Renfe"
station_code = "uic_in_stop_id"
station_code_pattern = '^(\d{5})$'
station_code_prefix = "71"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>.+)$'
category_field = "agency_name"
number_is_line = true

[[feed]]
mirror_name = "es_Ferrocarriles-de-la-Generalitat-de-Cataluña"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>.+)$'
category_field = "agency_name"
number_is_line = true

[[feed]]
mirror_name = "es_Euskotren"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>.+)$'
category_field = "agency_name"
number_is_line = true

[[feed]]
# Stop IDs are 94, an underscore and the five digits of the UIC code after the country code.
mirror_name = "pt_Comboios-de-Portugal(CP)"
station_code = "uic_in_stop_id"
station_code_pattern = '^94_(\d{5})$'
station_code_prefix = "94"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
# The file holds the national railway among 700 bus routes.
mirror_name = "lu_administration-des-transports-publics"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "fi_digitraffic"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "ee_elron"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>.+)$'
category_field = "agency_name"
number_is_line = true

[[feed]]
mirror_name = "lt_LTG-Link"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"

[[feed]]
mirror_name = "lv_pieturas"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "agency_name"
