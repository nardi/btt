# Feeds the timetable builder reads, by their name on the Transitous mirror at
# https://api.transitous.org/gtfs/. The part before the first underscore names the country file
# in the Transitous feed configuration, which holds the license of each feed.

validity_window_days = 90

# Categories of trains with couchettes or sleepers, compared without regard to case. A train
# also counts when any feed gives it the GTFS route type 105, and when any feed's copy of a
# merged train does.
night_train_categories = [
    "NJ",
    "Nightjet",
    "EN",
    "EuroNight",
    "ES",
    "European Sleeper",
    "ICN",
    "InterCityNotte",
    "INTERCITES de nuit",
]

[[feed]]
mirror_name = "nl_OpenOV"
# Platforms carry the station area as parent_station, so the default key rule fits.
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "de_DELFI"
# DHID platform IDs such as de:05315:11201:7:71 often have no parent_station.
station_key_pattern = '^(de:\d+:\d+)'
station_key_namespace = "dhid"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Route short names are line numbers, so the category comes from the route type.
category_field = "route_type"

[[feed]]
# Transitous removes the Berlin and Brandenburg operators from DELFI and loads them from this
# feed instead, so without it no regional train or S-Bahn crosses Berlin.
mirror_name = "de_VBB"
station_key_pattern = '^(de:\d+:\d+)'
station_key_namespace = "dhid"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Route short names are lines such as "RE1" and "S5".
category_field = "route_short_name"

[[feed]]
mirror_name = "at_Railway-Current-Reference-Data-2026"
# Platforms carry their station as parent_station, such as Pat:44:46500.
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "eu_european-sleeper"
station_code = "uic_in_stop_id"
[feed.train_label]
field = "route_short_name"
pattern = '^(?<category>[A-Za-z]+)\s*(?<number>\d+)$'
category_field = "route_short_name"

[[feed]]
mirror_name = "be_sncb"
# Stop IDs start with the UIC code, as in 8891140_1 for a platform of Aalter.
station_code = "uic_in_stop_id"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
# Route short names are products such as "IC" or lines such as "S41".
category_field = "route_short_name"

[[feed]]
mirror_name = "fr_horaires-sncf"
# Stop IDs end with the UIC code and its check digit, as in StopArea:OCE87313759.
station_code = "uic8_in_stop_id"
[feed.train_label]
# The headsign holds the train number, and trip_short_name is missing.
field = "trip_headsign"
pattern = '^(?<number>\d+)$'
# Route short names are line codes. The product is part of every stop point ID, as in
# StopPoint:OCETGV INOUI-87686006.
category_field = "first_stop_id"
category_pattern = '^StopPoint:OCE(?<category>.+)-\d+$'

[[feed]]
mirror_name = "fr_eurostar-gtfs-plan-de-transport-et-temps-reel"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
# Route short names are station code pairs, and every agency is named Eurostar.
category_field = "agency_name"

# Swiss timetables run from December to December, so the window needs two feeds around the
# change of timetable.
[[feed]]
mirror_name = "ch_opentransportdataswiss26"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
# Route descriptions hold the product, such as "IC", "IR" or "S".
category_field = "route_desc"

[[feed]]
mirror_name = "ch_opentransportdataswiss27"
[feed.train_label]
field = "trip_short_name"
pattern = '^(?<number>\d+)$'
category_field = "route_desc"

[[feed]]
# Trenitalia publishes NeTEx in the Italian profile only. Transitous converts nothing, so this
# is the NeTEx file its preprocessor collects from the Italian access point.
mirror_name = "it_trenitalia"
format = "netex"
source_url = "https://public-transport.github.io/transitous-trenitalia-preprocessor/trenitalia-netex.zip"
station_code = "uic_in_private_code"
[feed.train_label]
field = "trip_short_name"
pattern = '^0*(?<number>\d+)$'
# Lines are products, such as FR for Frecciarossa or REG for regional trains.
category_field = "route_short_name"
