# How the train labels of the timetable map to the train pages of vagonWEB.
#
# vagonWEB names a train by an operator code, a category and a number, such as `DB`, `ICE` and
# `71`. Each rule below gives the operator code of the trains whose agency matches `agency` and,
# when the rule has one, whose category matches `category`. Rules are tried in order and the
# first that matches wins, so a rule with a category comes before the general rule of the same
# agency. A train that no rule matches gets no link.
#
# The category on vagonWEB is the category of the timetable, unless the rule gives
# `vagonweb_category`. Category patterns ignore case. A rule only decides the names to look for.
# The builder links to a page only when the dictionary `data/vagonweb-trains.txt` lists it.
#
# The example `vagonweb_survey` of `btt-builder` compares the labels of a bundle with the
# sitemaps and proposes the pairs for new rules.

# Categories whose numbers name the same train in every country, so a page of another operator
# with the same category and number is the same train. The link then says it is approximate.
approximate_categories = ["EC", "ECE", "EN", "ICE", "NJ", "RJ", "RJX", "TGV"]

# Austria.
[[rule]]
agency = '^(OEBB|Österreichische Bundesbahnen|ÖBB)'
operator = "ÖBB"
category = '^S$'
vagonweb_category = "SB"

[[rule]]
agency = '^(OEBB|Österreichische Bundesbahnen|ÖBB)'
operator = "ÖBB"

