# Train operators, recognised from the agency names of the timetable feeds.
#
# The feeds name one operator in many ways, such as "SNCF Voyageurs LO" and "SNCF VOYAGEURS", or
# "RegioJet a.s." and "RegioJet,a.s.". Each rule below gives the operator of a train whose agency
# matches `agency` and, when the rule has one, whose category matches `category`. Rules are tried
# in order and the first that matches wins, so a rule with a category comes before the general
# rule of the same agency. A train that no rule matches keeps its agency name as its operator.
#
# `id` is the name the app uses for the operator, such as in the choice of booking site and in
# price models. `country` is the country of the operator's home network. The example
# `agency_survey` of `btt-planner` lists the agency names of a bundle.

# France. The French feed names TER regions as agencies, such as "CFF" and "TMR SA", and runs the
# brands of SNCF under the same agencies.
[[operator]]
id = "ouigo"
name = "OUIGO"
country = "FR"
agency = '^(SNCF|CFF$|TMR SA$)'
category = '^OUIGO'

[[operator]]
id = "lyria"
name = "TGV Lyria"
country = "FR"
agency = '^(SNCF|CFF$|TMR SA$)'
category = '^Lyria$'

[[operator]]
id = "sncf"
name = "SNCF"
country = "FR"
agency = '^(SNCF|CFF$|TMR SA$)'

[[operator]]
id = "eurostar"
name = "Eurostar"
country = "FR"
agency = '^Eurostar$'

