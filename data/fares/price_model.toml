    "IC", "ICN", "ICL", "ICD", "ICS", "EC", "ECE", "EuroCity", "Eurocity Direct", "RJ", "RJX",
    "IR", "EIC", "TLK", "INTERCITES", "Intercités", "Intercity", "FB", "Alvia", "WB", "FLX", "LE",
