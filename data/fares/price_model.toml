# The kind of a train from its category, compared without regard to case. A rule with operators
# applies to their trains only. A train with couchettes or sleepers is a night train whatever
# its category, and a train no rule matches is regional.
[[kind_rule]]
kind = "high_speed"
categories = [
    "ICE", "ICE Sprinter", "TGV", "TGV INOUI", "INOUI", "OUIGO", "Lyria", "Eurostar", "FR",
