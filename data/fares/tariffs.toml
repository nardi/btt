# Distance based tariffs of operators, as formulas.
#
# A formula gives the price of a full fare single ticket in second class from the tariff distance
# in kilometres. These are fits to published prices and not the operators' own tables, so the app
# marks a price from a formula as an estimate.

[[tariff]]
id = "cd-basic"
operator = "ČD"
country = "CZ"
currency = "CZK"
# The price is `base + per_kilometre * distance`, rounded to whole crowns.
base = 17.0
per_kilometre = 2.04
source = "https://www.cd.cz/en/jizdenky/"
notes = "Fitted to published single fares in second class. Domestic trains only. The fit has not been checked against the tariff table."
# The exchange rate is a rough fixed value, to be replaced by a rate the user can set.
euro_per_crown = 0.041
