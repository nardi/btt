# Seat reservation rules for passholders, by country, operator and train category.
#
# Fees are in euro for one passenger and one train. Each fee is a range of the lowest and highest
# price seen. Sources are the domestic, international and night train reservation pages at
# interrail.eu, checked in 2026. A rule with the scope "international" covers a route between
# countries, and a rule with the scope "night" covers sleeping accommodation.
#
# A rule with `unverified = true` has a fee that is a rough value and has to be checked against the
# Interrail page before the planner shows it as more than an estimate.
#
# Modes:
#   mandatory   - a passholder can't board without a reservation.
#   recommended - a reservation is possible and advised.
#   optional    - a reservation is possible and not needed.
#   free        - no reservation exists, and the pass is enough.
#   supplement  - a fee that is not a reservation, which a passholder pays on top.
#   varies      - depends on the train, so the fee is the range.

[[rule]]
id = "at-domestic"
unverified = true
scope = "domestic"
country = "AT"
operator = "ÖBB"
categories = ["RJ", "RJX", "EC", "IC"]
mode = "optional"
fee = { second = [3.0, 3.0], first = [3.0, 3.0] }
notes = "Reservations are optional on most trains."

