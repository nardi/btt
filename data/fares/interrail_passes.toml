# Interrail passes and their prices.
#
# Prices are the Interrail Global Pass prices valid as of 5 January 2026, in euro, from the price
# list of Deutsche Bahn at assets.static-bahn.de (PreiseIRGlobal2026BahnDeIntBahnDeEN_05012026.pdf),
# which matches the table on seat61.com. The Interrail shop loads its prices with scripts, and
# they can differ by country of residence and by promotion, so the shop is the final word. The age
# group is the age on the first day of travel.

source = "https://assets.static-bahn.de/dam/jcr:6fc22f3d-72c4-473b-a15a-7b234ba0f03c/PreiseIRGlobal2026BahnDeIntBahnDeEN_05012026.pdf"
checked_against = "https://www.seat61.com/how-to-use-an-interrail-pass.htm"
as_of = "2026-01-05"
currency = "EUR"

# Age groups. Children under 4 travel free without a pass.
[age_groups]
child = { from = 4, to = 11, note = "Free Child Pass, with a paying adult, youth of 18 or older, or senior. At most two children for each of them, in the class of the adult." }
youth = { from = 12, to = 27 }
adult = { from = 28, to = 59 }
senior = { from = 60 }

# The Global Plus Pass costs a fixed amount more and comes with reservation credits. It is in beta.
[global_plus]
extra_price = 100.0
reservation_credits = 3
note = "Most reservations cost no credit. High-demand trains such as Eurostar and the TGV to other countries cost one or two. Sleeping accommodation on night trains is not covered."
source = "https://plus.interrail.com/en/global-plus-pass"

# A flexi pass has travel days to pick within its validity. A continuous pass makes every day of
# its validity a travel day.
[[pass]]
id = "global-flexi-4-in-1-month"
kind = "flexi"
travel_days = 4
validity_months = 1
prices = { adult = { second = 283.0, first = 367.0 }, youth = { second = 212.0, first = 275.0 }, senior = { second = 255.0, first = 330.0 } }

