# Assistance, wheelchair spaces and companion discounts for wheelchair users, by operator.
#
# The `operator` field is an `id` from `data/operators.toml`. The `notice_hours` field is the
# number of hours before departure by which the traveller has to book assistance.
#
# `wheelchair_space` is one of:
#   { kind = "free" }                         - a space is available without a reservation.
#   { kind = "reservation", fee = [lo, hi] }  - a space must be reserved, for a fee in euro.
#   { kind = "not_available" }                - the trains have no wheelchair space.
#
# `companion` is one of:
#   { kind = "free" }                         - one companion travels free of charge.
#   { kind = "percent_off", percent = n }     - one companion gets n percent off a single ticket.
#   { kind = "none" }                         - there is no companion discount.
# The `entitlement` field names the card or document that gives the discount.
#
# `categories_not_accessible` lists train categories that the operator lists as not step-free.
#
# An entry with `unverified = true` has values from memory or from an old page. The planner uses
# such an entry for tickets, but it does not count it as a confirmation that a train is step-free.

[[operator]]
id = "db-fernverkehr"
unverified = true
assistance_url = "https://www.bahn.de/service/individuelle-reise/barrierefrei/mobilitaetsservice"
notice_hours = 24
wheelchair_space = { kind = "reservation", fee = [0.0, 0.0] }
companion = { kind = "free", entitlement = "Schwerbehindertenausweis with the mark B" }
notes = "Book assistance and the wheelchair space with the Mobilitätsservice-Zentrale."

