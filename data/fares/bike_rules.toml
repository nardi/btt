# Rules for an assembled bike on a train, by operator and train category.
#
# Fees are in euro for one bike. Each fee is a range of the lowest and highest price seen. The
# `per` field tells whether the fee is for one ride or for all rides of the operator on one day.
# The `operator` field is an `id` from `data/operators.toml`. A rule without categories covers
# every train of the operator. A rule that lists the category of a train comes before it.
#
# A rule with `unverified = true` has values from memory or from an old page. The planner uses
# such a rule to price a bike, but it does not count the rule as a confirmation that the train
# takes bikes. Check each rule against the page of the operator, then remove the flag.
#
# Modes:
#   free        - the bike travels without a ticket.
#   ticket      - the bike needs a ticket, and any train with bike spaces takes it.
#   reservation - the bike needs a reserved bike space. The fee covers the ticket as well.
#   bagged_only - only a bike that is taken apart and packed in a bag can travel.
#   not_allowed - no bike can travel.
#
# A folding bike travels as luggage on all trains, so these rules do not apply to it.

[[rule]]
id = "de-long-distance"
unverified = true
operator = "db-fernverkehr"
categories = ["ICE", "IC", "EC"]
mode = "reservation"
fee = [7.0, 9.9]
per = "ride"
booking = "https://www.bahn.de/service/individuelle-reise/fahrrad"
notes = "A bike ticket for long-distance trains includes the bike space reservation."

[[rule]]
id = "de-regional"
unverified = true
operator = "db-regio"
mode = "ticket"
fee = [6.0, 7.0]
per = "day"
booking = "https://www.bahn.de/service/individuelle-reise/fahrrad"
notes = "The Fahrradtageskarte Nahverkehr covers all regional trains on one day. Some regions let bikes travel free."

[[rule]]
id = "de-flixtrain"
unverified = true
operator = "flixtrain"
mode = "reservation"
fee = [9.0, 10.0]
