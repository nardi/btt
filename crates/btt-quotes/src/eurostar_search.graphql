query NewBookingSearch($origin: String!, $destination: String!, $outbound: String!, $inbound: String, $productFamilies: [String] = ["PUB"], $contractCode: String = "EIL_ALL", $adult: Int, $child: Int, $infant: Int, $youth: Int, $senior: Int, $adults16Plus: Int = 0, $children4Only: Int = 0, $children5To11: Int = 0, $adultsWheelchair: Int = 0, $childrenWheelchair: Int = 0, $guideDogs: Int = 0, $wheelchairCompanions: Int = 0, $nonWheelchairCompanions: Int = 0, $filteredClassesOfService: [ClassOfServiceEnum], $filteredClassesOfAccommodation: [ClassEnum], $currency: Currency!, $isAftersales: Boolean = false, $hasInbound: Boolean = false, $multipleFlexibility: Boolean = true, $subscriptionCode: TravelPassTemplateCode, $showAllSummatedFares: Boolean = false, $seniorsAges: [Int!], $childAges: [Int!], $youthAges: [Int!], $prioritiseShortHaulODTrains: Boolean = false, $hideExternalCarrierTrains: Boolean = true, $hideDirectExternalCarrierTrains: Boolean = true, $maxTransfers: Int) {
  journeySearch(
    outboundDate: $outbound
    inboundDate: $inbound
    origin: $origin
    destination: $destination
    adults: $adult
    seniors: $senior
    productFamilies: $productFamilies
    contractCode: $contractCode
    adults16Plus: $adults16Plus
    children: $child
    youths: $youth
    children4Only: $children4Only
    children5To11: $children5To11
    infants: $infant
    adultsWheelchair: $adultsWheelchair
    childrenWheelchair: $childrenWheelchair
    guideDogs: $guideDogs
    wheelchairCompanions: $wheelchairCompanions
    nonWheelchairCompanions: $nonWheelchairCompanions
    isAftersales: $isAftersales
    currency: $currency
    multipleFlexibility: $multipleFlexibility
    subscriptionCode: $subscriptionCode
    showAllSummatedFares: $showAllSummatedFares
    seniorsAges: $seniorsAges
    childAges: $childAges
    youthAges: $youthAges
    prioritiseShortHaulODTrains: $prioritiseShortHaulODTrains
    maxTransfers: $maxTransfers
  ) {
    outbound {
      ...searchBound
      __typename
    }
    inbound @include(if: $hasInbound) {
      ...searchBound
      __typename
    }
    __typename
  }
}

fragment searchBound on Offer {
  origin {
    name
    city
    uic
    __typename
  }
  destination {
    name
    city
    uic
    __typename
  }
  classesOfService {
    name
    code
    __typename
  }
  journeys(
    hideIndirectTrainsWhenDisruptedAndCancelled: false
    hideDepartedTrains: true
    hideExternalCarrierTrains: $hideExternalCarrierTrains
    hideDirectExternalCarrierTrains: $hideDirectExternalCarrierTrains
  ) {
    ...journey
    __typename
  }
  __typename
}

fragment journey on Journey {
  timing {
    date
    departureTime: departs
    arrivalTime: arrives
    duration
    __typename
  }
  fares(
    filteredClassesOfService: $filteredClassesOfService
    filteredClassesOfAccommodation: $filteredClassesOfAccommodation
  ) {
    isThroughFare
    isSummatedFare
    promo {
      type
      value
      __typename
    }
    class {
      name
      code
      __typename
    }
    classOfService {
      name
      code
      __typename
    }
    prices {
      displayPrice
      total
      child
      adult
      senior
      youth
      bundlePrice
      exchangeFee
      fareDiscounts {
        basePrice
        youth
        senior
        totalSavings
        __typename
      }
      __typename
    }
    discount {
      code
      amount
      __typename
    }
    seats
    availabilityOfClassOfService
    legs {
      flexibilityLevel
      products {
        passengerId
        passengerAgeGroup {
          type
          name
          age
          __typename
        }
        isFareAddOn
        tariffCode
        bucketCode
        loyaltyPoints
        name
        code
        price
        availabilityOfClassOfService
        __typename
      }
      addOnProducts {
        passengerId
        passengerAgeGroup {
          type
          name
          age
          __typename
        }
        isFareAddOn
        tariffCode
        bucketCode
        loyaltyPoints
        name
        code
        price
        availabilityOfClassOfService
        __typename
      }
      classOfService {
        code
        name
        __typename
      }
      origin {
        name
        uic
        city
        __typename
      }
      destination {
        name
        uic
        city
        __typename
      }
      serviceName
      serviceType {
        name
        code
        brandCode
        __typename
      }
      serviceIdentifier
      timing {
        date
        departureTime: departs
        arrivalTime: arrives
        departureDate
        arrivalDate
        duration
        isoDate
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}
