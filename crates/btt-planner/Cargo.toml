[package]
name = "btt-planner"
description = "Plans the legs of a BTT trip and streams the results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = ["stub"]
# Fake journeys from straight-line distances, for UI work without timetable data.
stub = []

[dependencies]
btt-geo.workspace = true
btt-model.workspace = true
btt-router.workspace = true
btt-timetable.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
postcard.workspace = true
regex.workspace = true
rustc-hash.workspace = true
serde.workspace = true
smol_str.workspace = true
smallvec.workspace = true
tokio.workspace = true
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
btt-storage.workspace = true
sha2.workspace = true
zip.workspace = true

[lints]
workspace = true
