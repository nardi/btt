<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages cannot set headers, so the page states its own policy. It allows what the
         page and its map need and nothing else, which also keeps the promise that the page sends
         the trip nowhere. The map tiles come from one host, and the map's workers from blobs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https://tiles.openfreemap.org; img-src 'self' data: blob: https://tiles.openfreemap.org; style-src 'self' 'unsafe-inline'; worker-src blob:; child-src blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>BigTrainTrip trip</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
