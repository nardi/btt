name: Release

on:
  push:
    tags: ["v*"]

# Jobs that need more than reading ask for it themselves.
permissions:
  contents: read

jobs:
  # A tag that differs from the Cargo version stops the run before anything is built.
  tag:
    name: Check the tag against the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with the workspace version
        run: |
          # The first line that starts with `version =` is the one in `[workspace.package]`.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version v$version in Cargo.toml."
            exit 1
          fi

  checks:
    name: Checks
    needs: tag
    uses: ./.github/workflows/ci.yml

  # The installer jobs all upload to one draft, so it is created once here. Letting each of them
  # create it would produce a draft per platform.
  draft:
    name: Create the draft release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="BigTrainTrip $GITHUB_REF_NAME" \
            -f body="Draft. Smoke test the installers, write the notes and publish." \
            -F draft=true \
            --jq .id)
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  installers:
    name: Installer for ${{ matrix.os }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}

  # A portable build is the app without an installer. It is compiled with the `portable-build`
  # feature, which asks on first launch where to keep the data. It needs no installation and no
  # admin rights.
  portable:
    name: Portable build for ${{ matrix.os }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Windows and Linux get the bare executable. macOS needs the `.app` bundle to run at all.
      - name: Build the app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx tauri build --bundles app --features portable-build
          else
            npx tauri build --no-bundle --features portable-build
          fi
      - name: Pack the portable folder
        run: |
          version="${GITHUB_REF_NAME#v}"
          folder="BigTrainTrip-$version-portable"
          mkdir "$folder"
          case "$RUNNER_OS" in
            Windows)
              cp target/release/btt-app.exe "$folder/BigTrainTrip.exe"
              7z a "$folder-windows.zip" "$folder"
              echo "ARCHIVE=$folder-windows.zip" >> "$GITHUB_ENV"
              ;;
            Linux)
              cp target/release/btt-app "$folder/BigTrainTrip"
              tar -czf "$folder-linux.tar.gz" "$folder"
              echo "ARCHIVE=$folder-linux.tar.gz" >> "$GITHUB_ENV"
              ;;
            macOS)
              # `ditto` keeps the permissions and the extended attributes that the bundle needs.
              ditto target/release/bundle/macos/BigTrainTrip.app "$folder/BigTrainTrip.app"
              ditto -c -k --keepParent "$folder" "$folder-macos.zip"
              echo "ARCHIVE=$folder-macos.zip" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"

  # The viewer goes live at tag time, while the release is still a draft. That way the live
  # viewer reads the schema the new app writes before anyone can install the app.
  viewer:
    name: Deploy the web viewer and app
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time, and a newer tag replaces an older one that is still running.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build-wasm
      - run: npm run build --workspace ui/viewer
      - run: npm run build --workspace ui/web
      # The site holds the viewer, the web app and the timetable that the web app downloads.
      - run: node tools/assemble-pages-site.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
